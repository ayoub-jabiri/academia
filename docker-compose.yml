services:
  mongodb:
    image: mongo:7.0
    container_name: academia-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./back-end
    container_name: academia-back-end
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_URL=mongodb://mongodb:27017/academia-db
      - JWT_SECRET=e0a91231-18c8-4611-a055
    depends_on:
      - mongodb

  frontend:
    build: ./front-end
    container_name: academia-front-end
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

volumes:
  mongo_data:
